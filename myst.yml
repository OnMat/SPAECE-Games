    - jogo concreto
    - baixo custo
    - ensino médio
    
  github: https://github.com/OnMat/SPAECE-Games
  
  toc:
    - file: index.md
    - file: orientacoes.md
    - file: numeros-e-funcoes/index.md
      children:
        - file: numeros-e-funcoes/domino-dos-racionais.md
        - file: numeros-e-funcoes/jogo-da-memoria-dos-racionais.md
        - file: numeros-e-funcoes/trilha-dos-juros-simples.md
        - file: numeros-e-funcoes/batalha-dos-investidores.md
        - file: numeros-e-funcoes/escape-room-dos-polinomios.md
        - file: numeros-e-funcoes/trinca-dos-polinomios.md
        - file: numeros-e-funcoes/missao-probabilidade.md
        - file: numeros-e-funcoes/teatro-das-retas.md
        - file: numeros-e-funcoes/dados-das-funcoes.md
    - file: geometria/index.md
      children:
        - file: geometria/corrida-das-semelhancas.md
        - file: geometria/pitagotrilha.md
        - file: geometria/cara-a-cara-dos-poligonos.md
        - file: geometria/planificacao.md
        - file: geometria/monte-seu-triangulo.md
        - file: geometria/batalha-cartesiana.md
    - file: sobre.md

  plugins:
    - template/pdf-cards.mjs

  exclude:
    - README.md
    - LICENSE
    - template/**

  downloads:
    - id: spaece-games-pdf
      title: Baixar PDF

  exports:
    - id: spaece-games-pdf
      format: typst
      template: template
      output: exports/spaece-games.pdf
      subtitle: Jogos concretos de baixo custo alinhados aos descritores de matemática do SPAECE
      advisor: Prof. Dr. Vicente Helano Feitosa Batista Sobrinho
      institution: Universidade Federal do Cariri
      program: Mestrado Profissional em Matemática em Rede Nacional (PROFMAT)
      place: Juazeiro do Norte
      year: "2025"
      logo: public/logo.svg
      cover: template/capa.jpg
      cover_width: 15
      ToC_depth: 2
      site_url: https://onmat.github.io/SPAECE-Games/

site:
  template: book-theme
  options:
    style: public/style.css
    logo: public/logo.svg
    folders: false
  actions:
  #   favicon: favicon.ico
    - title: GitHub Repo
      url: https://github.com/OnMat/SPAECE-Games
    - title: Feedback
      url: https://github.com/OnMat/SPAECE-Games/issues
    - title: Download PDF
      url: ./exports/spaece-games.pdf
